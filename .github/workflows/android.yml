name: Android CI - AzadiYar

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify project files
        shell: bash
        run: |
          echo "Checking Android project files..."
          test -f app/build.gradle.kts || {
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          }
          echo "Android module found."

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: false

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Check APK output
        shell: bash
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Debug APK was not generated."
            find app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK generated successfully."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AzadiYar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
